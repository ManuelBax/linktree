<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manuel Bacci · Link</title>

  <meta property="og:title" content="Manuel Bacci">
  <meta property="og:type" content="website">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="bg" aria-hidden="true">
    <span class="blob"></span>
    <span class="blob"></span>
    <span class="blob"></span>
  </div>

  <main class="card">
    <img class="avatar" src="img/picProfilo.jpeg" alt="Foto di Manuel Bacci">

    <h1>Manuel Bacci</h1>
    <p class="bio">Scrolla pure</p>

    <!-- I pulsanti vengono creati da script.js leggendo links.json -->
    <nav class="links" id="links"></nav>
  </main>

  <footer class="footer">
    <small>niente onlyfans, scusa la delusione</small>
  </footer>

  <!-- Finestra uscita  -->
  <dialog class="modal" id="outing-modal" aria-label="Proponi un'uscita">
    <form class="modal-form" id="outing-form">
      <button type="button" class="modal-close" id="outing-close" aria-label="Chiudi">×</button>

      <label class="field">
        Nome e cognome
        <input type="text" name="nome" required autocomplete="name">
      </label>

      <div class="row">
        <label class="field">
          Giorno
          <input type="date" name="data" required>
        </label>
        <label class="field">
          Ora
          <input type="time" name="ora">
        </label>
      </div>

      <label class="field">
        Dove
        <input type="text" name="luogo">
      </label>

      <label class="field">
        Programma
        <textarea name="programma" required></textarea>
      </label>

      <!-- trappola anti-spam -->
      <input type="checkbox" name="botcheck" hidden tabindex="-1" autocomplete="off">

      <button type="submit" class="btn btn-send">Invia 🍻</button>
      <p class="modal-status" id="outing-status" role="status"></p>
    </form>
  </dialog>

  <script src="script.js"></script>
</body>
</html>
